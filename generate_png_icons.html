<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Generate Icons</title></head>
<body>
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c192" width="192" height="192"></canvas>
<img id="svgImg" src="icon.svg" style="display:none" />
<script>
window.onload = function() {
  const img = document.getElementById('svgImg');
  
  // 512x512
  const c512 = document.getElementById('c512');
  const ctx512 = c512.getContext('2d');
  ctx512.drawImage(img, 0, 0, 512, 512);
  const data512 = c512.toDataURL('image/png').replace(/^data:image\/png;base64,/, '');

  // 192x192
  const c192 = document.getElementById('c192');
  const ctx192 = c192.getContext('2d');
  ctx192.drawImage(img, 0, 0, 192, 192);
  const data192 = c192.toDataURL('image/png').replace(/^data:image\/png;base64,/, '');

  window.iconData = { d512: data512, d192: data192 };
  console.log('ICONS_READY');
};
</script>
</body>
</html>
